<!DOCTYPE html>
<html>

<head>
    <title>To-Do App</title>

    <style>

        body{
            width:500px;
            margin:40px auto;
            font-family:Arial;
        }

        input{
            width:350px;
            padding:10px;
        }

        button{
            padding:10px;
        }

        li{
            margin:10px 0;
        }

    </style>

</head>

<body>

<h1>My To-Do List</h1>

<input id="task">

<button onclick="addTask()">Add</button>

<ul id="tasks"></ul>

<script>

const backend="http://docker.pavithra.sbs:8000";

async function loadTasks(){

    const res=await fetch(`${backend}/tasks`);

    const data=await res.json();

    let html="";

    data.forEach((task,index)=>{

        html+=`
        <li>

            ${task}

            <button onclick="deleteTask(${index})">Delete</button>

        </li>
        `;

    });

    document.getElementById("tasks").innerHTML=html;

}

async function addTask(){

    const task=document.getElementById("task").value;

    await fetch(`${backend}/add`,{

        method:"POST",

        headers:{
            "Content-Type":"application/json"
        },

        body:JSON.stringify({
            task:task
        })

    });

    document.getElementById("task").value="";

    loadTasks();

}

async function deleteTask(index){

    await fetch(`${backend}/delete/${index}`,{

        method:"DELETE"

    });

    loadTasks();

}

loadTasks();

</script>

</body>

</html>
